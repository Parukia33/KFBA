l_english:


perform_appeasement_ritual1_title: "Appease Ocean 'Aumakua"
perform_appeasement_ritual1_desc: "The Ali'i and Kahuna will gather to give offerings to the ocean to calm the raging spirits."
perform_appeasement_ritual2_title: "Appease Mo'o"
perform_appeasement_ritual2_desc: "The Ali'i and Kahuna will gather to give offerings to the mo'o and remind them of our cohabilitation of the ponds."
perform_appeasement_ritual3_title: "Rally Warriors"
perform_appeasement_ritual3_desc: "The Ali'i will host a luau and hula competition to exorcise the mischevous spirits plaguing our warriors.:"
perform_appeasement_ritual4_title: "Stabilize Moku"
perform_appeasement_ritual4_desc: "The Ali'i and Kahuna will send out new laws to better manage the Kapus of interacting so closely with the 'Aumakua."


unknown_currents: "Unknown Currents"
unknown_currents_desc: "The currents are strange and the few sailors who return talk of vicious and magical beasts that control the waters"
moo_forbid_access: "Mo'o Forbid Access to Lo'i and Loko"
moo_forbid_access_desc: "Our taro farms and fishponds are overrun with aggressive Mo'o, the hala trees have purple leaves signalling their presence."
warriors_afriad: "Warriors Afraid"
warriors_afriad_desc: "Our warriors speak of angry ghosts and trickster spirits plaguging the night, preventing them from sleeping and disrupting watches."
panic_hawaii: "Panic!"
panic_hawaii_desc: "The commonfolk are overwhelmed by the appearance of fickle 'Aumakua. Jealousy rises agains those visibily favored."

