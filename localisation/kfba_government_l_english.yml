l_english:
 kapu_system_reform:0 "Kapu System"
 kapu_system_reform_desc:0 "The Kapu System is the ancient Hawaiian religious law code governing social interactions, with spiritual prohibitions against overexploiting natural resources. Sustainable practice was a religious responsibility defined by the Ali'i's stewardship of their land."
 ability_hawaiian_mana:0 "Mana"
 mana:0 "Mana"
 mana_desc:0 "Mana represents the Ali'i's righteous stewardship of their elder sibling, the land. People of high standing and places of great power naturally build mana, calling more to themselves while sharing it with those under them. A leader with much mana can make great changes to the world."
 monthly_mana:0 "Montly Mana Use"
 cultivate_mana:0 "Cultivate Mana"
 cultivate_mana_desc:0 "An Ali'i may consult their Kahuna for rituals and training to grow their mana specifically, the intense effort taking away from the day to day running of the state."
 
 kotan_reform:0 "Kotan"
 kotan_reform_desc:0 "The Kotan is the basic administrative division of Ainu life. Sometimes described as a "village," it represents any place where people gather and organize. The chief of a kotan could be asked to perform shamanistic rituals and other spiritually focused administration."