l_english:
 A_WORLD_AFTER_DARKNESS:0 "A World After Darkness"
 A_WORLD_AFTER_DARKNESS_DESC:0 "A world after darkness."
 ADRIFT:0 "Adrift"
 ADRIFT_DESC:0 "Adrift on the great sea, the world has shifted after the eclipse in ways we don't yet know."
 SENGOKU:0 "Sengoku Jidai"
 SENGOKU_DESC:0 "After the week of darkness, Daimyo see the sun rise on a land similar but different from their own. The Alph empire finds itself shattered, areas riven from its lands. In their place, only humans remain, the citzens, human and pokemon alike nowhere to be found. In the far north, the Ainu wake to find the Kamuy more active, displaying their divine powers openly in their animal forms."
