 ability_hawaiian_mana: "Mana"
 mana: "Mana"
 mana_desc: "Mana represents the Ali'i's righteous stewardship of their elder sibling, the land. People of high standing and places of great power naturally build mana, calling more to themselves while sharing it with those under them. A leader with much mana can make great changes to the world."
 monthly_mana: "Montly Mana Use"
 cultivate_mana: "Cultivate Mana"
 cultivate_mana_desc: "An Ali'i may consult their Kahuna for rituals and training to grow their mana specifically, the intense effort taking away from the day to day running of the state."

 hawaiian: "Kanaka Maoli"
 hoomana_kapu: "Ho'omana Kapu"
 hoomana_kapu_religion_desc:1 "The gathering of mana in accordance with the Kapu system emphasized social and religious unity, with spiritual prohibitions against overfishing or harvesting. Defernce to the gods was secondary to the import of the land with some sources arguing for the effective atheism of some adherents. Sustainable practice was a social and religious responsibility monitored by the Kahuna, wise people who had studied many years in various arts. Those who were masters of all the arts could be called Kahuna Nui, or high priests who were influential teachers for all followers of the religion offering guidance in periods of strife."

 frattricelli: "Frattricelli"
 frattricelli_religion_desc:1 "in the desperate times post the calamity, a new pope from our people was needed, and we were the few who knew to build it."

 waldesians: "Waldesians"
 waldesians_religion_desc:1 "The pope is not here, we do not need Rome to still be close to God."