l_english:
 A_WORLD_AFTER_DARKNESS:0 "A World After Darkness"
 A_WORLD_AFTER_DARKNESS_DESC:0 "Starting in November 1444, something strange happened. An unnatural darkness took over the whole world and two dimensions slowly intersected. When the lights finally returned, the world was different. For the nations of the Holy Roman Empire, they found themselves in a different continent, in a different world. For them, there was no way of knowing why this happened or how to return. As such, they were left with no choice but to settle and explore this New World."
 ADRIFT:0 "Adrift"
 ADRIFT_DESC:0 "Adrift on the great sea, the world has shifted after the eclipse in ways we don't yet know. The Hawaiians will have to consolidate fast if they don't want to be destroyed by the New World's many monsters."
 SENGOKU:0 "Sengoku Jidai"
 SENGOKU_DESC:0 "After the week of darkness, some Daimyos see the sun rise on a land similar but different from their own. The Alphbrail Empire finds itself shattered, areas riven from its lands. In their place, only humans remain; the citzens, human and Pokémon alike nowhere to be found. In the far north, the Ainu wake to find the Kamuy more active, displaying their divine powers openly in their animal forms."
