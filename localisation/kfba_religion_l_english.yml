 otherworldly:0 "Otherworldly"
 arceusism:0 "Arceusist"
 arceusism_religion_desc:0 "The primary belief from the other world. For Arceusists, everything was created by a single Pokémon, Arceus, that was born from an egg in a place where there was nothing. It then shaped reality with its one thousand arms. Its creations then gave shape to the world, as the Original One fell into slumber, which continues until today. The Pokémon World has a certain continent shaped like Arceus. If this continent is united under a single ruler, Arceus itself will grant them its powers, or so say the legends."
 pokemon_religion: "Pokémon Religion"
 pokemon_religion_religion_desc:0 "The natural religion of all Pokémon, it is the belief that, although Pokémon created the universe, they do not deserve, or want, idolatry. Even if they're taught some other faith, their minds eventually gravitate towards this."