 kamuy_nomi:0 "Kamuy Nomi"
 kamuy_nomi_religion_desc:0 "Kamuy Nomi represents the rituals and prayers used to entreat the gods and spirits of the natural world. The gods are thought to take on the forms of animals as gifts to the Ainu people. Many rituals emphasize thanking the Kamui for the gift of their eathly bodies to use as sustenance. Of the gods, the bear is considered one of the most important, and specific rituals to venerate the bear are emphasized in special worship."

 hawaiian:0 "Kanaka Maoli"
 hoomana_kapu:0 "Ho'omana Kapu"
 hoomana_kapu_religion_desc:0 "The gathering of mana in accordance with the Kapu system emphasized social and religious unity, with spiritual prohibitions against overfishing or harvesting. Defernce to the gods was secondary to the import of the land with some sources arguing for the effective atheism of some adherents. Sustainable practice was a social and religious responsibility monitored by the Kahuna, wise people who had studied many years in various arts. Those who were masters of all the arts could be called Kahuna Nui, or high priests who were influential teachers for all followers of the religion offering guidance in periods of strife."
