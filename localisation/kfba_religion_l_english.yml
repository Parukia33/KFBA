l_english:
 anticatholic:0 "Anticatholic"
 anticatholic_religion_desc:0 "The Anticatholic faith represents the beliefs of those accepted Antipope Felix V, who was nominated in the Council of Basel after Pope Eugene IV was declared a heretic, as the legitimate Pope. Therefore, they deny the Catholic sucession issue, since their Pope was also sent to the New World."
 fraticelli:0 "Fraticelli"
 fraticelli_religion_desc:0 "The Fraticelli were splitters from the Franciscan Order due to opposition to the wealth of the Church. First appearing in the 13th century Italy, the movement was quickly declared heretical and suppressed in most Italian provinces, although they found refuge in some, like Perugia."
 waldensian:0 "Waldensian"
 waldensian_religion_desc:0 "The Waldensians, whose movement was founded by Peter Waldo in late 12th century France, spread through the Alps preaching apostolic pverty and refusing to recognize the prerogatives of local bishops over the content of their sermons or who had the qualifications to preach, which got them labeled as heretics by the Church and persecuted."
 papist:0 "Papist"
 papist_religion_desc:0 "Papist Catholics are those who, after the Council of Trent, determined a new Pope must be elected for the New World, despite the lack of cardinals or of the knowledge of the status of the current Pope. They believe that the Pope, ruling of the new Papal State, has the supreme authority over New World Catholics."
 episcopalian:0 "Episcopalian"
 episcopalian_religion_desc:0 "Episcopalian Catholics are those who, after the Council of Trent, determined it's impossible to designate a new Pope because of the lack of cardinals and the lack of knowledge about the status of the current Pope. They believe Coucils of Bishops have the new ultimate authority over New World Catholics."
 imperialist:0 "Imperialist"
 imperialist_religion_desc:0 "Imperialist are those who reject both Papist and Episcoplian claims, instead declaring that the Holy Roman Emperor, as the defender of the Catholic faith, has the new absolute authority over the Church, transforming the doctrine of the two swords into the doctrine of one sword. Although rejected by most New World Catholics, few have the power to oppose the Emperor of Romans."
