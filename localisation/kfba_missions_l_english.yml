l_english:
 kfba_alp_subjects_title:0 "Entei's Strength"
 kfba_alp_subjects_desc:0 "We will need Entei's strength to regain control over our farther terriorites, show that we our blessed with his power."
 kfba_alp_stability_title:0 "Raikou's Cunning"
 kfba_alp_stability_desc:0 "It would take Raikou's cunning to claw out of the hole we are in, show that we can succeed in stabilizing our nation."
 kfba_alp_end_disaster_title:0 "Rising like Ho Oh"
 kfba_alp_end_disaster_desc:0 "After the horror of the longest night, it was said that it would take divine intervention for the empire to remain standing. We have shown we have that blessing, and now we rise from the burdens of our past like Ho Oh after the storm."
 kfba_alp_time_title:0 "Suicune's Grace"
 kfba_alp_time_desc:0 "If we can manage to remain emperor for ten years, we will show we have Suicune's blessing to continue our rule of Nippon."
