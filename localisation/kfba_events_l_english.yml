l_english:
 kfba_setup.1.title:0 "The Light Returns"
 kfba_setup.1.desc:0 "After a week of pure darkness, light returns to the world, and what we find is something familiar, yet not quite like what we had. Our lands have changed shape and, even more notably, Europe has disappeared. The Holy Roman Empire now stands alone in its own continent. We do not know what happened, why or even if we can return things to how they were."
 kfba_setup.1.a:0 "Where are we?"
 
 kfba_anticatholic.1.title:0 "The Last Antipope"
 kfba_anticatholic.1.desc:0 "The Pope is gone... Or so they think, for the true Pope, Felix V, and previous Duke of Savoy still lives. Being now undisputed in his reign, it has come the time to accept Felix V as the rightful Pope!"
 kfba_anticatholic.1.a:0 "God has chosen Felix V!"
 kfba_anticatholic.1.b:0 "We must not make rash decisions."
 kfba_anticatholic.1.c:0 "God has chosen me!"
 
 kfba_fall_of_nippon_disaster.1.title:0 "The Fall of Nippon"
 kfba_fall_of_nippon_disaster.1.desc:0 "The Alphbrail Empire came to be with the union between the Alphabet Kingdom and the Braille Kingdom through a miracle. Despite being long lasting and peacefully ruling the Nippon Continent, it had been plagued with regionalism for the last centuries. Its decline was clear when its provinces in the regions of Kanto, Johto, Hoenn and Sinnoh, in search for more autonomy, started contained civil wars, even though they continued to pay tribute to the capital and, nominally at least, still belonged to the Empire. But now, Alphabet and Braille supporters were once again eager to carve out influence in the historical capital for themselves, imposing their will on the other. To make matters worse, the world was suddenly engulfed into an unnatural darkness and, when light returned, the warring regions were no more, with foreigners being left in their place. These foreigners appear lack knowledge about our world, the creator Arceus or even the basics about Pokémon. Instead, they talk of "Buddha" and "Amaterasu", alien concepts we can bother to understand as the Northern Kingdom and the Southern Kingdoms begin to clash."
 kfba_fall_of_nippon_disaster.1.a:0 "Ironically after the dark times."
 kfba_fall_of_nippon_disaster.2.title:0 "Ho Oh's Rise"
 kfba_fall_of_nippon_disaster.2.desc:0 "We have returned the empire to a state of stability and may now focus on integrating our once rebelious subjects."
 kfba_fall_of_nippon_disaster.2.a:0 "We have Triumphed!"
 kfba_fall_of_nippon_disaster.3.t:0 "Alphabet claims regional control"
 kfba_fall_of_nippon_disaster.3.d:0 "Local nobility in traditional Alphabet lands have claimed control of our administrative centers there. While still feigning loyalty to our throne, they are not to be trusted."
 kfba_fall_of_nippon_disaster.3.a:0 "Betrayal!"
 kfba_fall_of_nippon_disaster.4.title:0 "Braille claims regional control"
 kfba_fall_of_nippon_disaster.4.desc:0 "Local nobility in traditional Braille lands have claimed control of our administrative centers there. While still feigning loyalty to our throne, they are not to be trusted."
 kfba_fall_of_nippon_disaster.4.a:0 "Backstabbers!"
 kfba_fall_of_nippon_disaster.5.title:0 "Pretender to the Throne"
 kfba_fall_of_nippon_disaster.5.desc:0 "Claiming the darkness a sign from Arceus, a pretender with only a tangential claim to the royal blood has gathered supporters to their banner."
 kfba_fall_of_nippon_disaster.5.a:0 "Giratina take them!"

 kfba_flavor_hab.1.title:0 "Ladislaus Postumus Missing"
 kfba_flavor_hab.1.desc:0 "As if predicting a catastrophe, our wise $MONARCHTITLE$ ordered his heir, Ladislaus Postumus to be sent to Hungary until the darkness subsided. By now, however, not only has Hungary disappeared, we had no luck in finding the carriage carrying Ladislaus Postumous which, by all accounts, should still be in Austrian lands. With each passing day, our hopes of finding the boy decrease. We may be forced to act like he's gone good."
 kfba_flavor_hab.1.a:0 "We pray that he survived somehow."

 kfba_flavor_uhw.1.title:0 "Auwe!"
 kfba_flavor_uhw.1.desc:0 "A night that lasted a week has turned into an even worse horror, something is wrong with the currents and our Aumakua spirits act against us with fire, lightning, and other strange powers."
 kfba_flavor_uhw.1.a:0 "Only a leader with great mana could see us through."
 kfba_hawaii_setup_DESC_TOOLTIP:0 "until the appropriate §YDecision§! is taken"
 
 kfba_fraticelli.1.title:0 "Fraticelli Resurgence"
 kfba_fraticelli.1.desc:0 "Although the Fraticelli heresy had been contained, the sudden lack of Church authority seemed to have enboldened the heretics. They now demand their right to follow and spread their religious ideas, and consider themselves chosen by God, who would've struck down the false Pope. This development is a cause of great concern in an already weakened Holy Roman Empire."
 kfba_fraticelli.1.a:0 "Heretics!"
 kfba_fraticelli.1.b:0 "They see the light!"
 
 kfba_old_catholic.1.title:0 "The Pope Is Gone"
 kfba_old_catholic.1.desc:0 "It has come to the attention of the Catholic world, which now is limited to the Holy Roman Empire, that the Papal State, the Pope and all the College of Cardinals has disappeared. Without a head of faith to guide us and even lacking the members that can elect a new Pope, it is uncertain what will become of the Catholic faith. A crisis unlike any other has began and we can only pray to God, assuming He still exists in this world, to give us an answer."
 kfba_old_catholic.1.a:0 "What will become of Catholicism?"
 kfba_old_catholic.2.title:0 "The New World and the Catholic Faith"
 kfba_old_catholic.2.desc:0 "Over 15 years have passed since we've been flung into another world. Our hopes of returning to what things once were dwindle year by year. More importantly, to the Catholic faith a quarter of a century has passed without any Cardinals being assigned or Pope being elected. The crisis of faith has reached a boiling point in which some action, any action, has to be taken even if by one who does not have proper authority to do so. Therefore, a Council has been summoned by influential bishops be convened in Trent in order to discuss how best to reform the Church to meet the challenge of this New World."
 kfba_old_catholic.2.a:0 "Convene the Council of Trent!"
 kfba_old_catholic.3.title:0 "The Council of Trent"
 kfba_old_catholic.3.desc:0 "We have been invited to attend the Council of Trent to debate the required reforms to remedy the afflictions of the church. The Council will discuss what will be done to the Old Catholic faith. While the condemnation of the surging heresies is a sure result of the Council, the question of on whom lies the authority of the Church in this New World is a much more complicated matter. The discussion is mostly dividing between those who accept we have to elect a new Pope and those who admit bishops are the new highest canon authority."
 kfba_old_catholic.3.a:0 "We must elect a Pope!"
 kfba_old_catholic.3.b:0 "Conciliarism is the answer!"
 kfba_old_catholic.3.c:0 "The Emperor reigns supreme!"
 kfba_old_catholic.4.title:0 "Old Catholic Holdouts"
 kfba_old_catholic.4.desc:0 "Although the Catholic Church has reformed to the new realities of this New World, we have stuck to our ways until now. It is time to take a stand."
 kfba_old_catholic.4.a:0 "We stand with the new Pope!"
 kfba_old_catholic.4.b:0 "The Bishops will guide us!"
 kfba_old_catholic.4.c:0 "Only the Emperor can lead us!"
 
 kfba_waldensian.1.title:0 "Waldensian Resurgence"
 kfba_waldensian.1.desc:0 "Although the Waldensian heresy had been contained, the sudden lack of Church authority seemed to have enboldened the heretics. They now demand their right to follow and spread their religious ideas, and consider themselves chosen by God, who would've struck down the false Pope. This development is a cause of great concern in an already weakened Holy Roman Empire."
 kfba_waldensian.1.a:0 "Heretics!"
 kfba_waldensian.1.b:0 "They see the light!"