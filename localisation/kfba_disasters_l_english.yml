l_english:
 kfba_fall_of_nippon_disaster:0 "Fall of Nippon"
 kfba_fall_of_nippon_disaster_desc:0 "The Alphbrail Empire ruled Nippon for a millenium after unifying the northern and southern Kingdoms. But the long lasting peace and isolation led to stagnation and eventually decline. The rules that once kept the peace between the two regions were being, little by little, ignored, as regionalism took place. The final nail in the Alphbrail Empire was put in place when the world was engulfed in darkness and its warring tributaries in Kanto, Johto, Hoenn and Sinnoh disappeared, leaving behind strange people who, despite speaking the same language, knew nothing of Pokémon."
 